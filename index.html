<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERONA ATELIER | Luxury Couture</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --bg: #0b0c10; 
            --card-bg: #12141c; 
            --gold: #d4af37; 
            --gold-light: #f3e5ab; 
            --text: #e5e5e5; 
            --muted: #a0a0a0; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; }
        h1, h2, h3, .brand-logo, nav a { font-family: 'Cinzel', serif; letter-spacing: 2px; }

        /* Announcement Ribbon */
        .ticker { background: linear-gradient(90deg, #111, var(--gold), #111); color: #000; font-size: 11px; font-weight: 700; text-align: center; padding: 8px 10px; text-transform: uppercase; letter-spacing: 1.5px; width: 100%; }

        /* Header Navigation */
        header { background: rgba(11, 12, 16, 0.95); border-bottom: 1px solid rgba(212, 175, 55, 0.2); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); width: 100%; }
        .nav-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px 5%; width: 100%; max-width: 1400px; margin: auto; }
        .brand-logo { font-size: 24px; font-weight: 700; color: var(--gold); text-decoration: none; text-shadow: 0 0 10px rgba(212, 175, 55, 0.2); margin-bottom: 10px; text-align: center; }
        
        nav { width: 100%; overflow-x: auto; display: flex; justify-content: center; }
        nav ul { display: flex; gap: 18px; list-style: none; white-space: nowrap; padding-bottom: 5px; justify-content: center; }
        nav ul li a { text-decoration: none; color: var(--text); font-size: 11px; text-transform: uppercase; cursor: pointer; transition: 0.3s; padding-bottom: 4px; border-bottom: 2px solid transparent; }
        nav ul li a:hover, nav ul li a.active { color: var(--gold); border-bottom-color: var(--gold); }

        @media (min-width: 768px) {
            .nav-container { flex-direction: row; justify-content: space-between; }
            .brand-logo { margin-bottom: 0; font-size: 26px; }
            nav ul { gap: 30px; }
            nav ul li a { font-size: 12px; }
        }

        /* Page Layout Container */
        .page-view { display: none; padding: 30px 5%; width: 100%; max-width: 1400px; margin: auto; min-height: 75vh; }
        .page-view.active-page { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Full Width Hero */
        .hero { 
            width: 100% !important; 
            min-height: 65vh; 
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(11,12,16,0.95) 100%), url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat; 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 40px 20px; 
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: auto;
        }
        
        .hero h1 { font-size: 28px; color: #fff; margin-bottom: 12px; text-shadow: 0 0 15px rgba(0,0,0,0.8); }
        .hero p { color: var(--gold-light); font-size: 14px; max-width: 650px; margin-bottom: 20px; line-height: 1.6; }

        @media (min-width: 768px) {
            .hero h1 { font-size: 46px; }
            .hero p { font-size: 16px; }
            .page-view { padding: 50px 6%; }
        }

        /* Trust Badges Bar */
        .trust-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; width: 100%; margin-top: 30px; padding: 20px; background: var(--card-bg); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 12px; text-align: center; }
        .trust-item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; color: #ccc; }
        .trust-item i { font-size: 20px; color: var(--gold); }

        /* Star Rating Badge */
        .rating-box { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 15px; background: rgba(212, 175, 55, 0.1); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .stars { color: #ffc107; font-size: 12px; }
        .rating-text { font-size: 12px; color: var(--gold-light); font-weight: 600; }

        /* Product Grid Fix (Centering & Full Width Cards) */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; width: 100%; justify-content: center; }
        .product-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; overflow: hidden; transition: 0.4s; position: relative; width: 100%; }
        .product-card:hover { border-color: var(--gold); transform: translateY(-5px); box-shadow: 0 10px 25px rgba(212,175,55,0.15); }
        .img-wrap { width: 100%; height: 380px; overflow: hidden; position: relative; }
        .product-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; display: block; }
        .product-card:hover img { transform: scale(1.05); }
        .badge { position: absolute; top: 12px; left: 12px; background: var(--gold); color: #000; font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
        .details { padding: 20px; text-align: center; width: 100%; }
        .details h3 { font-size: 17px; margin-bottom: 6px; color: #fff; }
        .details .price { color: var(--gold); font-size: 16px; font-weight: 700; margin-bottom: 12px; }

        /* Buttons */
        .btn-gold { background: linear-gradient(135deg, var(--gold), #b8860b); color: #000; font-weight: 700; padding: 12px 20px; border: none; border-radius: 30px; text-decoration: none; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; display: block; width: 100%; text-align: center; cursor: pointer; transition: 0.3s; }
        .btn-gold:hover { background: #fff; color: #000; box-shadow: 0 0 15px var(--gold); }

        /* Floating Concierge & AI Bot */
        .wa-float { position: fixed; bottom: 20px; left: 20px; background: #25d366; color: #fff; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; z-index: 1000; text-decoration: none; box-shadow: 0 5px 20px rgba(37,211,102,0.4); }
        .ai-float { position: fixed; bottom: 20px; right: 20px; background: linear-gradient(135deg, #111, #222); color: var(--gold); border: 1px solid var(--gold); padding: 12px 18px; border-radius: 30px; font-weight: 700; cursor: pointer; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 1px; }

        /* AI Interactive Chat Window */
        .chat-box { display: none; position: fixed; bottom: 80px; right: 20px; width: 310px; background: #12141c; border: 1px solid var(--gold); border-radius: 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); z-index: 1000; overflow: hidden; }
        .chat-head { background: linear-gradient(90deg, #0b0c10, #1b1e2b); color: var(--gold); padding: 12px 15px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(212,175,55,0.3); font-family: 'Cinzel', serif; font-size: 13px; }
        .chat-messages { height: 230px; padding: 12px; overflow-y: auto; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
        .msg-b { background: #1c202e; color: #ddd; padding: 8px 12px; border-radius: 8px; border-top-left-radius: 2px; align-self: flex-start; max-width: 85%; }
        .msg-u { background: var(--gold); color: #000; padding: 8px 12px; border-radius: 8px; border-top-right-radius: 2px; align-self: flex-end; max-width: 85%; font-weight: 600; }
        .chat-input-area { display: flex; border-top: 1px solid rgba(255,255,255,0.08); background: #0b0c10; }
        .chat-input-area input { flex: 1; padding: 10px; background: transparent; border: none; color: #fff; font-size: 11px; outline: none; }
        .chat-input-area button { padding: 10px 15px; background: var(--gold); color: #000; border: none; font-weight: 700; cursor: pointer; }
    </style>
</head>
